[package]
name = "mcpward-testing"
description = "Test issuer, mock token endpoint, test client, and conformance suite for mcpward servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["mcp", "oauth", "jwt", "testing"]
categories = ["development-tools::testing", "authentication"]

[dependencies]
mcpward = { workspace = true, features = ["server", "exchange", "aws-lc-rs"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
jsonwebtoken.workspace = true
axum = { workspace = true, features = ["http1", "tokio", "json", "query", "form"] }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
http.workspace = true
http-body-util.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
schemars.workspace = true
ulid.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["rustls", "json"] }

[dev-dependencies]
mcpward = { workspace = true, features = ["server", "exchange", "aws-lc-rs", "dev-auth"] }
tempfile = "3"

[lints]
workspace = true
