[workspace]
resolver = "3"
members = ["crates/mcpward", "crates/mcpward-testing", "examples/minimal", "examples/downstream"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/methodify/mcpward"
homepage = "https://github.com/methodify/mcpward"

[workspace.dependencies]
mcpward = { path = "crates/mcpward", version = "0.2.0", default-features = false }
mcpward-testing = { path = "crates/mcpward-testing", version = "0.2.0" }
rmcp = { version = "~3.8", default-features = false }
axum = { version = "0.8", default-features = false }
tower = "0.5"
tower-http = "0.6"
jsonwebtoken = { version = "11.1", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.13", default-features = false }
secrecy = "0.10"
arc-swap = "1"
moka = { version = "0.12", features = ["future"] }
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tokio = "1"
tokio-util = "0.7"
url = "2"
http = "1"
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ulid = "3"
schemars = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
